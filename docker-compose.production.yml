version: '3.8'

# =============================================================================
# GET READY BACKEND — PRODUCTION DOCKER COMPOSE
# Architecture: Single Linux Server / VM (AWS EC2, DigitalOcean, Azure, GCP, Hetzner)
# Database: External MongoDB Atlas (via DATABASE_URI)
# Infrastructure: Fully containerized Redis, RabbitMQ, Prometheus, Grafana, Loki, Promtail
# Ingress: Hardened Nginx Reverse Proxy (Ports 80 & 443 only)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-deploy-microservice: &microservice-deploy
  resources:
    limits:
      memory: 512M
      cpus: '1.0'
    reservations:
      memory: 128M
      cpus: '0.1'

x-deploy-gateway: &gateway-deploy
  resources:
    limits:
      memory: 768M
      cpus: '1.5'
    reservations:
      memory: 256M
      cpus: '0.25'

x-deploy-infra: &infra-deploy
  resources:
    limits:
      memory: 512M
      cpus: '1.0'
    reservations:
      memory: 128M
      cpus: '0.1'

networks:
  getready-network:
    name: getready-network
    driver: bridge

volumes:
  redis_data:
    name: getready_redis_data
  rabbitmq_data:
    name: getready_rabbitmq_data
  prometheus_data:
    name: getready_prometheus_data
  grafana_data:
    name: getready_grafana_data
  loki_data:
    name: getready_loki_data
  certbot_www:
    name: getready_certbot_www
  nginx_ssl:
    name: getready_nginx_ssl

services:
  # =========================================================================
  # 1. REVERSE PROXY & SSL INGRESS (Only 80 & 443 exposed publicly)
  # =========================================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: getready-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - getready-network
    deploy: *gateway-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/nginx-health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================================
  # 2. INFRASTRUCTURE SERVICES (Internal Docker Network Only)
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: getready-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_in_production} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-change_in_production}" ping | grep PONG || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: getready-rabbitmq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-change_in_production}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit disk_free_limit 2147483648'
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # =========================================================================
  # 3. OBSERVABILITY & MONITORING STACK
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: getready-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: getready-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change_in_production}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  loki:
    image: grafana/loki:3.0.0
    container_name: getready-loki
    restart: always
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/var/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    image: grafana/promtail:3.0.0
    container_name: getready-promtail
    restart: always
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging

  # =========================================================================
  # 4. API GATEWAY
  # =========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      target: production
    container_name: getready-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      GATEWAY_PORT: 3000
      APP_NAME: getready-api-gateway
      APP_URL: ${APP_URL:-https://api.getready.example.com}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BEAUTICIAN_SERVICE_URL: http://beautician-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      BOOKING_SERVICE_URL: http://booking-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      WALLET_SERVICE_URL: http://wallet-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      CONTENT_SERVICE_URL: http://content-service:3010
      WORKER_SERVICE_URL: http://worker-service:3011
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URI: ${DATABASE_URI}
      ALLOWED_ORIGINS: ${CORS_ORIGINS:-https://admin.getready.example.com,https://www.getready.example.com}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_in_production}
      REDIS_ENABLED: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: 'true'
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - getready-network
    deploy: *gateway-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================================================================
  # 5. CORE & BUSINESS MICROSERVICES
  # =========================================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: production
    container_name: getready-auth-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-change_in_production}@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_in_production}
      REDIS_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
