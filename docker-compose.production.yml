    container_name: getready-beautician-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin123@rabbitmq:5672}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_in_production}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - rabbitmq
      - redis
    networks:
