services:
  app:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: http://localhost:${PORT:-3000}
      # MongoDB: use DATABASE_URI / MONGODB_URI from .env (Atlas)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_ENABLED: 'true'
    command: npm run dev

  redis:
    ports:
      - '6379:6379'
