version: '3.8'

networks:
  getready-dev-network:
    driver: bridge

volumes:
  redis_dev_data:
  rabbitmq_dev_data:
  prometheus_dev_data:
  grafana_dev_data:
  uploads_dev_data:

services:
  # =========================================================================
  # LOCAL DEVELOPMENT BROKERS & CACHE (MongoDB is on MongoDB Atlas Cloud)
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: getready-dev-redis
    init: true
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    networks:
      - getready-dev-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: getready-dev-rabbitmq
    init: true
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
      - '15692:15692'
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - getready-dev-network

  # =========================================================================
  # DEVELOPMENT OBSERVABILITY STACK
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: getready-dev-prometheus
    init: true
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - getready-dev-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: getready-dev-grafana
    init: true
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dev_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    networks:
      - getready-dev-network

  loki:
    image: grafana/loki:3.0.0
    container_name: getready-dev-loki
    init: true
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - getready-dev-network

  # =========================================================================
  # API GATEWAY (DEVELOPMENT)
  # =========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: getready-dev-api-gateway
    init: true
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: 3000
      GATEWAY_PORT: 3000
      SWAGGER_ENABLED: 'true'
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BEAUTICIAN_SERVICE_URL: http://beautician-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      BOOKING_SERVICE_URL: http://booking-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      WALLET_SERVICE_URL: http://wallet-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      CONTENT_SERVICE_URL: http://content-service:3010
      WORKER_SERVICE_URL: http://worker-service:3011
      JWT_SECRET: getready_dev_super_secret_jwt_key_2026_at_least_32_characters
      DATABASE_URI: ${DATABASE_URI}
      LINODE_OBJECT_BUCKET: satyakabir-bucket
      LINODE_OBJECT_STORAGE_REGION: sgp1
      LINODE_OBJECT_STORAGE_ENDPOINT: https://sgp1.digitaloceanspaces.com
      LINODE_OBJECT_STORAGE_ACCESS_KEY_ID: DO003NRRKMN4DTETPLGA
      LINODE_OBJECT_STORAGE_SECRET_ACCESS_KEY: M5kmv62vtYMFrOwv2duhltYAAHLo26BbGeckKaG1lfE
      AWS_BUCKET_NAME: satyakabir-bucket
      AWS_REGION: sgp1
      AWS_ENDPOINT: https://sgp1.digitaloceanspaces.com
      AWS_ACCESS_KEY_ID: DO003NRRKMN4DTETPLGA
      AWS_SECRET_ACCESS_KEY: M5kmv62vtYMFrOwv2duhltYAAHLo26BbGeckKaG1lfE
    volumes:
      - ./services/api-gateway:/app/services/api-gateway
      - ./packages:/app/packages
    depends_on:
      - auth-service
      - user-service
    networks:
      - getready-dev-network

