  /api/v1/coupons/redeem:
    post:
      tags:
        - User
      summary: Atomically redeem a coupon for an order with duplicate check and usage
        lock
      operationId: redeemCoupon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - amount
                - orderId
                - userId
              properties:
                code:
                  type: string
                  example: WELCOME50
                amount:
                  type: number
                  example: 1200
                orderId:
                  type: string
                  example: order_65fc8e129182a1048b111002
                userId:
                  type: string
                  example: 65fc8e129182a1048b111002
      responses:
        "200":
          description: Coupon redeemed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: WELCOME50
                      discountAmount:
                        type: number
                        example: 200
                      payableAmount:
                        type: number
                        example: 1000
                      orderAmount:
                        type: number
                        example: 1200
                      orderId:
                        type: string
                        example: order_65fc8e129182a1048b111002
                  message:
                    type: string
                    example: Coupon redeemed successfully
        "409":
          description: Coupon usage limit reached or already redeemed by this account
  /api/v1/coupons/release:
    post:
      tags:
        - User
      summary: Release/rollback coupon usage if booking or payment fails
      operationId: releaseCoupon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: string
                  example: order_65fc8e129182a1048b111002
                couponId:
                  type: string
                  example: 65fc8e129182a1048b111001
                userId:
                  type: string
                  example: 65fc8e129182a1048b111002
                reason:
                  type: string
                  example: Payment failed
      responses:
        "200":
          description: Coupon usage released and restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      rolledBack:
                        type: boolean
                        example: true
                      orderId:
                        type: string
                        example: order_65fc8e129182a1048b111002
                  message:
                    type: string
                    example: Coupon usage released and restored successfully
