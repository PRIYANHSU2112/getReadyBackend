  /api/v1/bookings:
    post:
      tags:
        - User
      summary: Create a booking
      description: |
        Final booking creation after preview and payment.
        For SCHEDULED mode, provide slotId and holdToken.
        For INSTANT mode, a beautician is auto-dispatched.
      operationId: createBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressId
                - addressSnapshot
                - participants
                - items
              properties:
                idempotencyKey:
                  type: string
                  description: Unique key to prevent duplicate bookings on retry
                schedulingMode:
                  type: string
                  enum:
                    - INSTANT
                    - SCHEDULED
                  default: SCHEDULED
                slotId:
                  $ref: "#/components/schemas/ObjectId"
                scheduledDate:
                  type: string
                  format: date
                scheduledStartTime:
                  type: string
                  format: date-time
                holdToken:
                  type: string
                  description: Token received from /slots/hold
                addressId:
                  $ref: "#/components/schemas/ObjectId"
                addressSnapshot:
                  $ref: "#/components/schemas/Address"
                participants:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/BookingParticipant"
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/BookingItem"
                hygieneKitQuantity:
                  type: integer
                  minimum: 1
                  default: 1
                membershipOptIn:
                  type: boolean
                couponCode:
                  type: string
                useWallet:
                  type: boolean
                usePoints:
                  type: boolean
                useCashback:
                  type: boolean
                paymentMethod:
                  type: string
                  enum:
                    - online
                    - wallet
                    - cod
                    - mixed
                  default: online
                specialInstructions:
                  type: string
                  maxLength: 500
                preferredBeauticianCount:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 1
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
