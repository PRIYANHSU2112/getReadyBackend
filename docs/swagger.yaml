        fields including KYC and bank details.
      operationId: adminCreateBeauticianProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  $ref: "#/components/schemas/PhoneNumber"
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                    - OTHER
                dob:
                  type: string
                  format: date
                languages:
                  type: array
                  items:
                    type: string
                bio:
                  type: string
                  maxLength: 1000
                experienceYears:
                  type: number
                skills:
                  type: array
                  items:
                    type: string
                eligibleServiceIds:
                  type: array
                  items:
                    type: string
                serviceRadiusKm:
                  type: number
                  minimum: 1
                  maximum: 100
                  default: 8
                operationalStatus:
                  type: string
                  enum:
                    - ONLINE
                    - OFFLINE
                    - AVAILABLE
                    - BUSY
                    - ON_LEAVE
                  default: AVAILABLE
                workingHours:
                  type: object
                  properties:
                    start:
                      type: string
                      example: 09:00
                    end:
