                bankName:
                  type: string
                  example: HDFC Bank
                accountNumber:
                  type: string
                  example: "8821"
                ifscCode:
                  type: string
                  example: HDFC0001234
                upiId:
                  type: string
                  example: beautician@okhdfcbank
                accountHolderName:
