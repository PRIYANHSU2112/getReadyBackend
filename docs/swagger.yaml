openapi: 3.0.3
info:
  title: GetReady Beauty Platform — Full API
  description: >
    Complete REST API documentation for the **GetReady Beauty Platform**
    microservices backend.


    ### Base URL

    All endpoints are served through the **API Gateway** at
    `http://localhost:5000` (or your deployed domain).


    ### Authentication

    - **Mobile apps** (User & Beautician): Bearer JWT tokens issued on OTP
    verification.

    - **Admin panel**: Bearer JWT tokens issued on email/password login.

    - Include header: `Authorization: Bearer <token>`


    ### Internal Headers (Gateway-injected, do NOT send from client)

    | Header | Description |

    |--------|-------------|

    | `x-user-id` | Authenticated user's MongoDB ObjectId |

    | `x-user-role` | Role: `customer` \| `beautician` \| `admin` \|
    `super_admin` |

    | `x-user-email` | User's email |

    | `x-user-phone` | User's phone |

    | `x-correlation-id` | Request tracing ID |


    ### Tag Organization

    | Tag | Consumer | Port |

    |-----|----------|------|

    | **User** | Customer mobile app | :5000 |

    | **Beautician** | Beautician mobile app | :5000 |

    | **Admin** | Admin web panel | :5000 |
  version: 1.0.0
  contact:
    name: GetReady Dev Team
servers:
  - url: http://localhost:5000
    description: Local API Gateway
  - url: https://api.priyashu.in
    description: Production API Gateway
tags:
  - name: User
    description: |
      All APIs consumed by the **User (Customer) Mobile App**.
      Requires `role: customer` JWT unless noted as public.
  - name: Beautician
    description: |
      All APIs consumed by the **Beautician Mobile App**.
      Requires `role: beautician` JWT unless noted as public.
  - name: Admin
    description: |
      All APIs consumed by the **Admin Panel** (web).
      Requires `role: admin` or `super_admin` JWT unless noted.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: 64f1a2b3c4d5e6f7a8b9c0d1
    PhoneNumber:
      type: string
      pattern: ^[+]?[\d\s\-]{10,15}$
      example: "+919876543210"
    GeoPoint:
      type: object
      properties:
        type:
          type: string
          enum:
            - Point
          default: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          example:
            - 77.4126
            - 23.2599
    AuthTokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
    UserProfile:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        role:
          type: string
          enum:
            - customer
            - beautician
            - admin
            - super_admin
            - ops
            - support
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dob:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - DEACTIVATED
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Address:
      type: object
      required:
        - addressLine1
        - city
        - state
        - pincode
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        label:
          type: string
          enum:
            - HOME
            - WORK
            - OFFICE
            - OTHER
          default: HOME
        addressLine1:
          type: string
        addressLine2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        isDefault:
          type: boolean
          default: false
    Member:
      type: object
      required:
        - name
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          maxLength: 100
        relationship:
          type: string
          default: Self
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        age:
          type: integer
          minimum: 0
          maximum: 120
        skinType:
          type: string
        hairType:
          type: string
        allergies:
          type: array
          items:
            type: string
        notes:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    Category:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        displayOrder:
          type: integer
        isActive:
          type: boolean
        thumbnailUrl:
          type: string
    Service:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        slug:
          type: string
        categoryId:
          $ref: "#/components/schemas/ObjectId"
        description:
          type: string
        price:
          type: number
          minimum: 0
        discountedPrice:
          type: number
        durationMinMinutes:
          type: integer
        durationMaxMinutes:
          type: integer
        homeVisitFee:
          type: number
        badges:
          type: array
          items:
            type: string
        gender:
          type: string
          enum:
            - all
            - female
            - male
            - unisex
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
        isActive:
          type: boolean
    Package:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        categoryId:
          $ref: "#/components/schemas/ObjectId"
        description:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        discountedPrice:
          type: number
        minSelectCount:
          type: integer
        maxSelectCount:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              serviceId:
                $ref: "#/components/schemas/ObjectId"
              name:
                type: string
              isMandatory:
                type: boolean
              isDefaultSelected:
                type: boolean
              extraCharge:
                type: number
    HygieneKit:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
        description:
          type: string
        price:
          type: number
          default: 49
        isDefault:
          type: boolean
    CartLineItem:
      type: object
      properties:
        lineId:
          type: string
        itemType:
          type: string
          enum:
            - SERVICE
            - PACKAGE
        refId:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number
        forMemberId:
          $ref: "#/components/schemas/ObjectId"
    Cart:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userId:
          $ref: "#/components/schemas/ObjectId"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLineItem"
        hygieneKitQuantity:
          type: integer
        specialInstructions:
          type: string
        couponCode:
          type: string
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
    BookingParticipant:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        relationship:
          type: string
          default: Self
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        age:
          type: integer
        skinType:
          type: string
        hairType:
          type: string
        allergies:
          type: array
          items:
            type: string
    BookingItem:
      type: object
      properties:
        itemType:
          type: string
          enum:
            - SERVICE
            - PACKAGE
          default: SERVICE
        serviceId:
          type: string
        name:
          type: string
        basePrice:
          type: number
        unitPrice:
          type: number
        quantity:
          type: integer
          default: 1
        durationMinutes:
          type: integer
        upgradeSelected:
          type: boolean
          default: false
        upgradeServiceId:
          type: string
        upgradePriceDifference:
          type: number
    Booking:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        bookingNumber:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - ASSIGNED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
            - FAILED
        schedulingMode:
          type: string
          enum:
            - INSTANT
            - SCHEDULED
        scheduledDate:
          type: string
          format: date
        addressSnapshot:
          $ref: "#/components/schemas/Address"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/BookingParticipant"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingItem"
        subtotal:
          type: number
        total:
          type: number
        paymentMethod:
          type: string
          enum:
            - online
            - wallet
            - cod
            - mixed
        createdAt:
          type: string
          format: date-time
    Slot:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        date:
          type: string
          format: date
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        maxBookings:
          type: integer
        availableCapacity:
          type: integer
        beauticianId:
          $ref: "#/components/schemas/ObjectId"
    Payment:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        bookingId:
          $ref: "#/components/schemas/ObjectId"
        orderId:
          type: string
        paymentId:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: INR
        status:
          type: string
          enum:
            - CREATED
            - PAID
            - FAILED
            - REFUNDED
            - PARTIAL_REFUND
        createdAt:
          type: string
          format: date-time
    Wallet:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userId:
          $ref: "#/components/schemas/ObjectId"
        balance:
          type: number
        points:
          type: integer
        cashback:
          type: number
    WalletTransaction:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        type:
          type: string
          enum:
            - CREDIT
            - DEBIT
        amount:
          type: number
        category:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    BeauticianProfile:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userId:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        bio:
          type: string
        experienceYears:
          type: number
        skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - DRAFT
            - INCOMPLETE
            - SUBMITTED
            - PENDING
            - UNDER_REVIEW
            - APPROVED
            - REJECTED
            - SUSPENDED
        kycStatus:
          type: string
          enum:
            - NOT_SUBMITTED
            - PENDING
            - UNDER_REVIEW
            - VERIFIED
            - REJECTED
            - EXPIRED
        operationalStatus:
          type: string
          enum:
            - ONLINE
            - OFFLINE
            - BUSY
            - AVAILABLE
            - ON_LEAVE
            - SUSPENDED
        isAvailable:
          type: boolean
        serviceRadiusKm:
          type: number
        rating:
          type: number
    BankDetail:
      type: object
      required:
        - accountHolderName
        - accountNumber
        - ifscCode
      properties:
        accountHolderName:
          type: string
        accountNumber:
          type: string
        ifscCode:
          type: string
        bankName:
          type: string
        branchName:
          type: string
        upiId:
          type: string
    Banner:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
        imageUrl:
          type: string
        targetUrl:
          type: string
        placement:
          type: string
        isActive:
          type: boolean
        displayOrder:
          type: integer
    Blog:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        thumbnailUrl:
          type: string
        isPublished:
          type: boolean
        likes:
          type: integer
    Review:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userId:
          $ref: "#/components/schemas/ObjectId"
        bookingId:
          $ref: "#/components/schemas/ObjectId"
        beauticianId:
          $ref: "#/components/schemas/ObjectId"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    Notification:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            pages:
              type: integer
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorCode:
          type: string
    MembershipPlan:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        planCode:
          type: string
          example: GLOW_CLUB_MONTHLY
        name:
          type: string
          example: GetReady Glow Club (Monthly)
        description:
          type: string
          example: Exclusive beauty membership with 15% off and complimentary treatments
        price:
          type: number
          example: 599
        billingCycle:
          type: string
          enum: [MONTHLY, QUARTERLY, ANNUAL]
          example: MONTHLY
        durationDays:
          type: integer
          example: 30
        discountType:
          type: string
          enum: [PERCENTAGE, FLAT]
          example: PERCENTAGE
        discountValue:
          type: number
          example: 15
        maxDiscountPerBooking:
          type: number
          example: 500
        minBookingSubtotal:
          type: number
          example: 0
        loyaltyMultiplier:
          type: number
          example: 2.0
        bonusPointsOnJoin:
          type: number
          example: 500
        complimentaryServices:
          type: array
          items:
            type: object
            properties:
              serviceId:
                type: string
                example: srv_threading_clean
              name:
                type: string
                example: Complimentary Eyebrow Threading / Cleanup
              quantityPerCycle:
                type: integer
                example: 1
              rolloverAllowed:
                type: boolean
                example: true
              rolloverMaxDays:
                type: integer
                example: 60
        familySharingAllowed:
          type: boolean
          example: true
        maxFamilyMembers:
          type: integer
          example: 4
        stackingRule:
          type: string
          enum: [EXCLUSIVE, CANNOT_STACK_WITH_COUPON, STACKABLE]
          example: CANNOT_STACK_WITH_COUPON
        marketingConfig:
          type: object
          properties:
            badgeText:
              type: string
              example: EXCLUSIVE MEMBERSHIP
            heroTitle:
              type: string
              example: Get Ready. Glow Club.
            perceivedWorthText:
              type: string
              example: ₹2,400+
            cartOptInTitle:
              type: string
              example: Join Glow Club & Save More Today
        status:
          type: string
          enum: [ACTIVE, PAUSED, RETIRED]
          example: ACTIVE
        isActive:
          type: boolean
          example: true

    CustomerMembershipStatus:
      type: object
      properties:
        isMember:
          type: boolean
          example: true
        hasActiveMembership:
          type: boolean
          example: true
        subscriptionId:
          type: string
          example: sub_1892abef71
        planCode:
          type: string
          example: GLOW_CLUB_MONTHLY
        tierName:
          type: string
          example: Glow Club Member
        status:
          type: string
          example: ACTIVE
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        daysRemaining:
          type: integer
          example: 24
        autoRenew:
          type: boolean
          example: true
        discountPercentage:
          type: number
          example: 15
        maxDiscountPerBooking:
          type: number
          example: 500
        loyaltyMultiplier:
          type: number
          example: 2.0
        familySharingAllowed:
          type: boolean
          example: true
        sharedWithCount:
          type: integer
          example: 2
        complimentaryEntitlements:
          type: array
          items:
            type: object
            properties:
              entitlementId:
                type: string
                example: ent_109823
              serviceName:
                type: string
                example: Complimentary Eyebrow Threading / Cleanup
              totalAllowed:
                type: integer
                example: 1
              usedCount:
                type: integer
                example: 0
              status:
                type: string
                example: AVAILABLE
              expiresAt:
                type: string
                format: date-time

    MembershipCartBenefits:
      type: object
      properties:
        isMember:
          type: boolean
          example: true
        optInApplied:
          type: boolean
          example: false
        membershipFee:
          type: number
          example: 0
        membershipDiscount:
          type: number
          example: 225
        discountPercentage:
          type: number
          example: 15
        savingsToday:
          type: number
          example: 225
        planCode:
          type: string
          example: GLOW_CLUB_MONTHLY
        tierName:
          type: string
          example: GetReady Glow Club (Monthly)
        loyaltyMultiplier:
          type: number
          example: 2.0

    AdminCreateMembershipPlanInput:
      type: object
      required:
        - planCode
        - name
        - price
      properties:
        planCode:
          type: string
          example: GLOW_CLUB_MONTHLY
        name:
          type: string
          example: GetReady Glow Club (Monthly)
        description:
          type: string
          example: Exclusive beauty membership with 15% off and complimentary treatments
        price:
          type: number
          example: 599
        billingCycle:
          type: string
          enum: [MONTHLY, QUARTERLY, ANNUAL]
          default: MONTHLY
        durationDays:
          type: integer
          default: 30
        discountType:
          type: string
          enum: [PERCENTAGE, FLAT]
          default: PERCENTAGE
        discountValue:
          type: number
          default: 15
        maxDiscountPerBooking:
          type: number
          default: 500
        minBookingSubtotal:
          type: number
          default: 0
        loyaltyMultiplier:
          type: number
          default: 2.0
        bonusPointsOnJoin:
          type: number
          default: 500
        complimentaryServices:
          type: array
          items:
            type: object
            required:
              - serviceId
              - name
            properties:
              serviceId:
                type: string
              name:
                type: string
              quantityPerCycle:
                type: integer
                default: 1
              rolloverAllowed:
                type: boolean
                default: true
              rolloverMaxDays:
                type: integer
                default: 60
        familySharingAllowed:
          type: boolean
          default: true
        maxFamilyMembers:
          type: integer
          default: 4
        stackingRule:
          type: string
          enum: [EXCLUSIVE, CANNOT_STACK_WITH_COUPON, STACKABLE]
          default: CANNOT_STACK_WITH_COUPON
        marketingConfig:
          type: object
        faqs:
          type: array
          items:
            type: object
            required:
              - question
              - answer
            properties:
              question:
                type: string
              answer:
                type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED, RETIRED]
          default: ACTIVE
        isActive:
          type: boolean
          default: true
  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden - insufficient role/permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Validation error / bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
paths:
  /api/v1/auth/mobile/send-otp:
    post:
      tags:
        - User
        - Beautician
      summary: Send OTP to phone number
      description: Sends a 6-digit OTP via SMS. Works for both customer and beautician
        roles.
      operationId: mobileSendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  $ref: "#/components/schemas/PhoneNumber"
                role:
                  type: string
                  enum:
                    - customer
                    - beautician
                  default: customer
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/mobile/resend-otp:
    post:
      tags:
        - User
        - Beautician
      summary: Resend OTP (60s cooldown)
      operationId: mobileResendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  $ref: "#/components/schemas/PhoneNumber"
                role:
                  type: string
                  enum:
                    - customer
                    - beautician
                  default: customer
      responses:
        "200":
          description: OTP resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/v1/auth/mobile/verify-otp:
    post:
      tags:
        - User
        - Beautician
      summary: Verify OTP and get JWT tokens
      description: |
        Verifies OTP. On first login, creates a new user account.
        Returns access + refresh JWT tokens.
      operationId: mobileVerifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  $ref: "#/components/schemas/PhoneNumber"
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                role:
                  type: string
                  enum:
                    - customer
                    - beautician
                  default: customer
                name:
                  type: string
                  maxLength: 100
                  description: Required only for first-time registration
                referralCode:
                  type: string
                fcmToken:
                  type: string
                  description: Firebase push notification token
      responses:
        "200":
          description: JWT tokens returned
          content:
            application/json:
