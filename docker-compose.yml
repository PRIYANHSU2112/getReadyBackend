version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-deploy-limits: &default-deploy
  resources:
    limits:
      memory: 512M
      cpus: '1.0'

networks:
  getready-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  uploads_data:

services:
  # =========================================================================
  # INFRASTRUCTURE SERVICES (Atlas used for MongoDB)
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: getready-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - getready-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: getready-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
      - '15692:15692'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - getready-network

  # =========================================================================
  # OBSERVABILITY STACK
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: getready-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - getready-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: getready-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    networks:
      - getready-network

  loki:
    image: grafana/loki:3.0.0
    container_name: getready-loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/var/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - getready-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: getready-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - getready-network

  # =========================================================================
  # API GATEWAY
  # =========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: getready-api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '8080:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BEAUTICIAN_SERVICE_URL: http://beautician-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      BOOKING_SERVICE_URL: http://booking-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      WALLET_SERVICE_URL: http://wallet-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      CONTENT_SERVICE_URL: http://content-service:3010
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_please_change_in_production}
    volumes:
      - ./services/api-gateway:/app/services/api-gateway
      - ./packages:/app/packages
    depends_on:
      - auth-service
      - user-service
    networks:
      - getready-network

  # =========================================================================
  # MICROSERVICES (Connected to MongoDB Atlas)
  # =========================================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: getready-auth-service
    restart: unless-stopped
    volumes:
      - ./services/auth-service:/app/services/auth-service
      - ./packages:/app/packages
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3002
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_please_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_please_change_in_production}
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: getready-user-service
    restart: unless-stopped
    volumes:
      - ./services/user-service:/app/services/user-service
      - ./packages:/app/packages
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  beautician-service:
    build:
      context: .
      dockerfile: services/beautician-service/Dockerfile
    container_name: getready-beautician-service
    restart: unless-stopped
    volumes:
      - ./services/beautician-service:/app/services/beautician-service
      - ./packages:/app/packages
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: getready-catalog-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: getready-booking-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3004
      BEAUTICIAN_SERVICE_URL: http://beautician-service:3003
    depends_on:
      - redis
      - rabbitmq
    networks:
      - getready-network

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    container_name: getready-cart-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URI: ${DATABASE_URI}
      CATALOG_SERVICE_URL: http://catalog-service:3004
      USER_SERVICE_URL: http://user-service:3002
      WALLET_SERVICE_URL: http://wallet-service:3008
    networks:
      - getready-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: getready-payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_SwGnzVleE55oE8}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-wg33MCoTYvfPf28NHg5uK6Qi}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    container_name: getready-wallet-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_SwGnzVleE55oE8}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-wg33MCoTYvfPf28NHg5uK6Qi}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: getready-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - getready-network

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: getready-content-service
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URI: ${DATABASE_URI}
    networks:
      - getready-network

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    container_name: getready-worker-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3011
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      - rabbitmq
      - redis
    networks:
      - getready-network
