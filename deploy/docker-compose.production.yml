# =============================================================================
# GET READY BACKEND — AWS PRODUCTION DOCKER COMPOSE
# Infrastructure: AWS EC2 (i-0a4e7008ca42520d2 / getReady-backend)
# ECR Registry: 154458646293.dkr.ecr.ap-south-1.amazonaws.com/getready-backend
# Database: External Managed MongoDB Atlas (via DATABASE_URI)
# Ingress: API Gateway (Port 3000)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-deploy-microservice: &microservice-deploy
  resources:
    limits:
      memory: 512M
      cpus: '1.0'
    reservations:
      memory: 128M
      cpus: '0.1'

x-deploy-gateway: &gateway-deploy
  resources:
    limits:
      memory: 768M
      cpus: '1.5'
    reservations:
      memory: 256M
      cpus: '0.25'

x-deploy-infra: &infra-deploy
  resources:
    limits:
      memory: 512M
      cpus: '1.0'
    reservations:
      memory: 128M
      cpus: '0.1'

networks:
  getready-network:
    name: getready-network
    driver: bridge

volumes:
  redis_data:
    name: getready_redis_data
  rabbitmq_data:
    name: getready_rabbitmq_data
  prometheus_data:
    name: getready_prometheus_data
  grafana_data:
    name: getready_grafana_data
  loki_data:
    name: getready_loki_data

services:
  # =========================================================================
  # 1. INFRASTRUCTURE SERVICES (Internal Docker Network Only)
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: getready-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_in_production} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-change_in_production}" ping | grep PONG || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: getready-rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-change_in_production}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit disk_free_limit 2147483648'
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # =========================================================================
  # 2. OBSERVABILITY & MONITORING STACK (Internal Docker Network Only)
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: getready-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: getready-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change_in_production}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  loki:
    image: grafana/loki:3.0.0
    container_name: getready-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/var/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    image: grafana/promtail:3.0.0
    container_name: getready-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - getready-network
    deploy: *infra-deploy
    logging: *default-logging

  # =========================================================================
  # 3. API GATEWAY (Public Ingress on Port 3000)
  # =========================================================================

  api-gateway:
    image: ${ECR_REGISTRY:-154458646293.dkr.ecr.ap-south-1.amazonaws.com/getready-backend}:api-gateway-${IMAGE_TAG}
    container_name: getready-api-gateway
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      GATEWAY_PORT: 3000
      APP_NAME: getready-api-gateway
      APP_URL: ${APP_URL:-https://api.getready.example.com}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      BEAUTICIAN_SERVICE_URL: http://beautician-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      BOOKING_SERVICE_URL: http://booking-service:3005
      CART_SERVICE_URL: http://cart-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      WALLET_SERVICE_URL: http://wallet-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      CONTENT_SERVICE_URL: http://content-service:3010
      WORKER_SERVICE_URL: http://worker-service:3011
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URI: ${DATABASE_URI}
      ALLOWED_ORIGINS: ${CORS_ORIGINS:-https://admin.getready.example.com,https://www.getready.example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.getready.example.com,https://www.getready.example.com}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_in_production}
      REDIS_ENABLED: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: 'true'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      - auth-service
      - user-service
      - redis
    networks:
      - getready-network
    deploy: *gateway-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================================================================
  # 4. CORE & BUSINESS MICROSERVICES (Internal Docker Network Only)
  # =========================================================================

  auth-service:
    image: ${ECR_REGISTRY:-154458646293.dkr.ecr.ap-south-1.amazonaws.com/getready-backend}:auth-service-${IMAGE_TAG}
    container_name: getready-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URI: ${DATABASE_URI}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-change_in_production}@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_in_production}
      REDIS_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      OTP_MAX_RESENDS_PER_HOUR: ${OTP_MAX_RESENDS_PER_HOUR:-3}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: 'true'
    depends_on:
      - rabbitmq
      - redis
    networks:
      - getready-network
    deploy: *microservice-deploy
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

