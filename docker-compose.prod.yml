x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-deploy-limits: &default-deploy
  resources:
    limits:
      memory: 512M
      cpus: '1.0'

services:
  app:
    build:
      context: .
      target: production
    container_name: salon-api
    restart: unless-stopped
    ports:
      # Host port from .env PORT (e.g. 5000) → container always listens on 3000
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Override .env PORT so the app listens on the mapped container port
      PORT: 3000
      APP_URL: http://localhost:${PORT:-3000}
      # MongoDB: use DATABASE_URI / MONGODB_URI from .env (Atlas)
      # Redis: Redis Cloud connection string, set in server .env
      REDIS_URL: ${REDIS_URL}
      REDIS_ENABLED: 'true'
    volumes:
      - uploads_data:/app/uploads
    logging: *default-logging
    deploy: *default-deploy
    networks:
      - salon-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: salon-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    logging: *default-logging
    deploy: *default-deploy
    networks:
      - salon-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: salon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    logging: *default-logging
    deploy: *default-deploy
    networks:
      - salon-network

volumes:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  salon-network:
    driver: bridge
