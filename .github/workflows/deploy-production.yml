name: Production Deployment (AWS SSM)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git Commit SHA to deploy (short or full 40-character SHA, leave empty for latest main commit)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ROLE_TO_ASSUME: arn:aws:iam::154458646293:role/getready-github-actions
  EC2_INSTANCE_ID: i-0a4e7008ca42520d2
  ECR_REPOSITORY: getready-backend

jobs:
  deploy-production:
    name: Deploy to EC2 via AWS SSM
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository with full history
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Resolve target Commit SHA (supports short or full SHA)
      # ---------------------------------------------------------
      - name: Resolve Target Commit SHA
        id: vars
        run: |
          RAW_INPUT="${{ github.event.inputs.commit_sha }}"
          RAW_INPUT="$(echo -e "${RAW_INPUT}" | tr -d '[:space:]')"

          if [ -n "${RAW_INPUT}" ]; then
            LOOKUP_REF="${RAW_INPUT}"
          else
            LOOKUP_REF="HEAD"
          fi

          echo "Resolving Git commit revision for reference: '${LOOKUP_REF}'..."
          
          # Safely resolve full 40-character commit SHA using git rev-parse
          if ! FULL_SHA="$(git rev-parse --verify "${LOOKUP_REF}^{commit}" 2>/dev/null)"; then
            echo "❌ ERROR: Cannot resolve '${LOOKUP_REF}' to a valid Git commit."
            echo "   Please provide a valid commit SHA or ensure the commit exists on remote."
            exit 1
          fi

          # Validate that the resolved SHA is exactly 40 hexadecimal characters
          if [[ ! "${FULL_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "❌ ERROR: Resolved value '${FULL_SHA}' is not a valid 40-character Git SHA."
            exit 1
          fi

          echo "Input SHA: ${LOOKUP_REF}"
          echo "Resolved full SHA: ${FULL_SHA}"

          echo "target_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=${FULL_SHA}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Configure AWS credentials using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS Credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # ---------------------------------------------------------
      # 4. Verify all 12 microservice images exist in ECR
      # ---------------------------------------------------------
      - name: Verify All 12 Microservice Images in ECR
        env:
          TARGET_SHA: ${{ steps.vars.outputs.target_sha }}
        run: |
          echo "================================================================="
          echo "🔍 Verifying all 12 ECR images for full SHA: ${TARGET_SHA}"
          echo "================================================================="
          
          SERVICES=(
            "api-gateway"
            "auth-service"
            "user-service"
            "beautician-service"
            "catalog-service"
            "booking-service"
            "cart-service"
            "payment-service"
            "wallet-service"
            "notification-service"
            "content-service"
            "worker-service"
          )

          # Polling loop: waits for images to become available (resilient against build timing)
          MAX_ATTEMPTS=40
          ATTEMPT=0

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            MISSING_SERVICES=()

            for svc in "${SERVICES[@]}"; do
              TAG="${svc}-${TARGET_SHA}"
              if ! aws ecr describe-images \
                --repository-name "${{ env.ECR_REPOSITORY }}" \
                --image-ids imageTag="${TAG}" \
                --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
                MISSING_SERVICES+=("${TAG}")
              fi
            done

            if [ ${#MISSING_SERVICES[@]} -eq 0 ]; then
              echo "✅ All 12 microservice images confirmed present in ECR for full SHA: ${TARGET_SHA}"
              for svc in "${SERVICES[@]}"; do
                echo "  • Verified: ${svc}-${TARGET_SHA}"
              done
              break
            fi

            if [ ${ATTEMPT} -ge ${MAX_ATTEMPTS} ]; then
              echo "❌ ERROR: Timed out waiting for images in ECR after ${MAX_ATTEMPTS} attempts."
              echo "Missing images (${#MISSING_SERVICES[@]}/12):"
              for missing in "${MISSING_SERVICES[@]}"; do
                echo "  - ${missing}"
              done
              exit 1
            fi

            echo "⏳ [Attempt ${ATTEMPT}/${MAX_ATTEMPTS}] ${#MISSING_SERVICES[@]}/12 images not yet in ECR. Waiting 15s..."
            sleep 15
          done

      # ---------------------------------------------------------
      # 5. Package deployment artifact & dispatch AWS SSM SendCommand
      # ---------------------------------------------------------
      - name: Package Deployment Artifact & Dispatch AWS SSM SendCommand
        id: ssm_deploy
        env:
          TARGET_SHA: ${{ steps.vars.outputs.target_sha }}
        run: |
          echo "================================================================="
          echo "📦 Packaging deployment configuration and scripts..."
          echo "================================================================="
          
          # Verify local deploy directory
          if [ ! -d "deploy" ]; then
            echo "❌ ERROR: deploy directory not found in repository root."
            exit 1
          fi

          # Create compressed deployment archive
          tar -czf /tmp/deploy-bundle.tar.gz -C deploy .
          BUNDLE_SIZE=$(wc -c < /tmp/deploy-bundle.tar.gz)
          echo "✅ Deployment bundle created: ${BUNDLE_SIZE} bytes"

          # Encode bundle to Base64
          BUNDLE_B64=$(base64 -w 0 /tmp/deploy-bundle.tar.gz)
          rm -f /tmp/deploy-bundle.tar.gz

          echo "📡 Preparing AWS SSM SendCommand payload..."
          echo "   Target Instance ID : ${{ env.EC2_INSTANCE_ID }}"
          echo "   Document Name      : AWS-RunShellScript"
          echo "   Target Full SHA    : ${TARGET_SHA}"

          # Construct SSM parameter JSON file
          jq -n \
            --arg sha "${TARGET_SHA}" \
            --arg b64 "${BUNDLE_B64}" \
            '{
              commands: [
                "set -eo pipefail",
                "echo \"=================================================================\"",
                "echo \"🚀 EC2 PRODUCTION DEPLOYMENT INITIALIZING\"",
                "echo \"   Target Full SHA  : \($sha)\"",
                "echo \"   Working Directory: /opt/getready\"",
                "echo \"   Timestamp        : $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\"",
                "echo \"=================================================================\"",
                "echo \"📁 [1/6] Preparing /opt/getready directory...\"",
                "mkdir -p /opt/getready",
                "cd /opt/getready",
                "echo \"📦 [2/6] Staging deployment bundle from artifact...\"",
                "echo \($b64) | base64 -d > /tmp/deploy-bundle.tar.gz",
                "echo \"📂 [3/6] Extracting deployment configuration and scripts...\"",
                "tar -xzf /tmp/deploy-bundle.tar.gz -C /opt/getready/",
                "rm -f /tmp/deploy-bundle.tar.gz",
                "echo \"🔍 [4/6] Verifying deployment files...\"",
                "for f in deploy-production.sh health-check.sh rollback-production.sh docker-compose.production.yml; do if [ ! -s \"$f\" ]; then echo \"❌ ERROR: Missing or empty file: /opt/getready/$f\"; exit 1; fi; echo \"  • Found: $f\"; done",
                "if [ ! -d \"monitoring\" ]; then echo \"❌ ERROR: Missing /opt/getready/monitoring directory\"; exit 1; fi",
                "echo \"  • Found: monitoring configuration directory\"",
                "echo \"🔑 [5/6] Setting executable permissions on scripts...\"",
                "chmod +x deploy-production.sh health-check.sh rollback-production.sh",
                "if [ ! -f \".env.production\" ]; then echo \"❌ ERROR: /opt/getready/.env.production not found! Please create it from .env.production.example.\"; exit 1; fi",
                "echo \"🚢 [6/6] Executing deploy-production.sh \($sha)...\"",
                "./deploy-production.sh \($sha)"
              ]
            }' > /tmp/ssm_parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Production deployment for Git SHA ${TARGET_SHA}" \
            --parameters file:///tmp/ssm_parameters.json \
            --timeout-seconds 600 \
            --region "${{ env.AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          rm -f /tmp/ssm_parameters.json

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "✅ SSM Command dispatched successfully. Command ID: ${COMMAND_ID}"

      # ---------------------------------------------------------
      # 6. Wait for SSM command completion and stream execution logs
      # ---------------------------------------------------------
      - name: Wait for SSM Command Completion & Stream Logs
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
        run: |
          echo "⏳ Waiting for SSM Command ${COMMAND_ID} execution on EC2 instance ${{ env.EC2_INSTANCE_ID }}..."

          STATUS="Pending"
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [[ "${STATUS}" == "Pending" || "${STATUS}" == "InProgress" || "${STATUS}" == "Delayed" ]]; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ ${ATTEMPT} -gt ${MAX_ATTEMPTS} ]; then
              echo "❌ ERROR: Timed out waiting for SSM command execution (10 minutes)."
              exit 1
            fi

            sleep 10

            INVOCATION_JSON=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --output json 2>/dev/null || echo '{"Status":"Pending"}')

            STATUS=$(echo "${INVOCATION_JSON}" | jq -r '.Status // "Pending"')
            echo "   • Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: Status is '${STATUS}'"
          done

          echo "================================================================="
          echo "📋 EC2 SSM DEPLOYMENT OUTPUT (Status: ${STATUS})"
          echo "================================================================="

          echo "--- STDOUT ---"
          echo "${INVOCATION_JSON}" | jq -r '.StandardOutputContent // ""'

          STDERR=$(echo "${INVOCATION_JSON}" | jq -r '.StandardErrorContent // ""')
          if [ -n "${STDERR}" ] && [ "${STDERR}" != "null" ]; then
            echo "--- STDERR ---"
            echo "${STDERR}"
          fi
          echo "================================================================="

          if [ "${STATUS}" != "Success" ]; then
            echo "❌ ERROR: SSM Command failed with status '${STATUS}'."
            exit 1
          fi

          echo "🎉 Production deployment successfully completed and verified on EC2!"
