name: CI/CD Pipeline & Server Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test, Lint & Configuration Validation
  # ---------------------------------------------------------------------------
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & Integration Tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/salon-ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          JWT_SECRET: ci-jwt-secret-min-16-chars-2026
          APP_URL: http://localhost:3000
          LOG_LEVEL: silent
          METRICS_ENABLED: 'false'
        run: npm test --if-present

      - name: Validate Production Docker Compose
        env:
          DATABASE_URI: mongodb+srv://ci_user:ci_pass@cluster0.mongodb.net/test
          JWT_SECRET: ci_secret_32_characters_long_key_2026
          JWT_REFRESH_SECRET: ci_refresh_32_characters_long_key_2026
          REDIS_PASSWORD: ci_redis_password
          RABBITMQ_USER: ci_rabbit_user
          RABBITMQ_PASS: ci_rabbit_pass
          GRAFANA_USER: admin
          GRAFANA_PASSWORD: ci_grafana_pass
        run: |
          docker compose -f docker-compose.production.yml config > /dev/null
          echo "✅ docker-compose.production.yml validation passed."

  # ---------------------------------------------------------------------------
  # 2. Build Docker Images
  # ---------------------------------------------------------------------------
  build-images:
    name: Build Docker Images
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Microservice Images
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker compose -f docker-compose.production.yml build --parallel
          echo "✅ All microservices built successfully."

  # ---------------------------------------------------------------------------
  # 3. Deploy to Production Server
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production Server
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Server Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/getready/Backend
            git pull origin main
            chmod +x ./scripts/*.sh
            ./scripts/deploy.sh .env.production
