name: Build and Push Backend Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 154458646293.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: getready-backend

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - beautician-service
          - catalog-service
          - booking-service
          - cart-service
          - payment-service
          - wallet-service
          - notification-service
          - content-service
          - worker-service

    steps:

      # ---------------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Configure AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::154458646293:role/getready-github-actions
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # 3. Verify AWS identity
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # 4. Login to Amazon ECR
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------
      # 5. Setup Docker Buildx
      # ---------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 6. Build and Push service image
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # IMPORTANT:
          # Dockerfiles use packages/ and services/ from repo root.
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile

          push: true

          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 7. Print pushed image
      # ---------------------------------------------------------
      - name: Image information
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image:"
          echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}"
